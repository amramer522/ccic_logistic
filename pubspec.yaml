name: ccic_g1_2026_flutter
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  animate_do: ^3.0.0
  google_nav_bar: ^5.0.7
  image_picker: ^1.2.3
  flutter_screenutil: ^5.9.3
  shimmer: ^3.0.0
  shared_preferences: ^2.5.5
  dio: ^5.11.1
  video_player: ^2.14.0
  youtube_player_flutter: ^10.0.1
  flutter_bloc: ^9.1.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

